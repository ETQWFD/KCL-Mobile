# launcher name & url
launcher_name=KCLMobile
# 界面显示名（顶栏、关于页、崩溃页、启动参数里的 launcher brand）。
# 项目叫 KCL Mobile，所以这里是它。
# 注意：这个名字**不再**参与 clientToken 的生成（见 AuthServerApi / MicrosoftAuthenticator
# 里的 CLIENT_TOKEN_SEED），否则改名会让所有已保存的登录态失效。
launcher_app_name=KCL Mobile
launcher_short_name=KCL
url_home=https://github.com/ETQWFD/KCL-Mobile

# your OAuth client id
#oauth_client_id=xxx

# your CurseForge API key
#curseforge_api_key=xxx

# default key, please add it yourself.
default_store_password=KclMobile200050
default_key_password=KclMobile200050

# launcher version
# 1.3.1-kcl.3：修复 LWJGL 在 JRE8 下的 FloatBuffer.flip() 崩溃（--release 8 编译）；
# 崩溃页新增「上报给开发者」（调用邮箱 2416444244@qq.com）；关于页补回龙腾猫跃鸣谢。
# 1.3.1-kcl.5：修复摇杆取消残留/验证补全空源崩溃/导出整合包写盘/大厅异常兜底/物品栏重复发键。
# v5（code 200055）：渲染器 PowerVR/Imagination GPU 自动切 Pure GL4ES + 着色器崩溃自动回退；
#   JNA 禁解包桌面 libjnidispatch（libc.so.6 修复）；本地账号离线服务器+user_type=legacy 避免 authlib 401；
#   -XX:MaxGCPauseMillis=100 低内存流畅度；关于页补 Zalith 原仓库作者。
# v6（code 200056）：未捕获异常处理器每步自保护防静默闪退；Fetcher 读缓冲 32KB→64KB 大文件提速。
# v7（code 200057）：修复游戏运行时画面四周白边——VMActivity 单独指定深色游戏主题（窗口/背景/状态栏/导航栏黑色兜底），
#   SurfaceView/TextureView 与外层 AndroidView 容器补黑色底色，消除状态栏区、letterbox 黑边之外、切屏瞬间与输入法弹起时露白。
# v8（code 200058）：新增模组版本不兼容前置检测（自动禁用+中文提示）、GL4ES/Krypton 低配性能版渲染器、
#   低配设备自动选型与「只降不升」画面预设（渲染距离/快速画质/关阴影/60帧上限）、模组冲突退出诊断关键词补全。
launcher_version_code=200059
launcher_version_name=1.3.1-kcl.9