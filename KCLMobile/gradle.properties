# launcher name & url
launcher_name=KCLMobile
# 界面显示名（顶栏、关于页、崩溃页、启动参数里的 launcher brand）。
# 项目叫 KCL Mobile，所以这里是它。
# 注意：这个名字**不再**参与 clientToken 的生成（见 AuthServerApi / MicrosoftAuthenticator
# 里的 CLIENT_TOKEN_SEED），否则改名会让所有已保存的登录态失效。
launcher_app_name=KCL Mobile
launcher_short_name=KCL
url_home=https://github.com/ETQWFD/KCL-Mobile

# your OAuth client id
#oauth_client_id=xxx

# your CurseForge API key
#curseforge_api_key=xxx

# default key, please add it yourself.
default_store_password=KclMobile200050
default_key_password=KclMobile200050

# launcher version
# 显示版本号改为 1.0（本项目独立版本线）；versionCode 保持 200043 不变，
# 避免破坏自动更新的升级链比较。
launcher_version_code=200050
launcher_version_name=1.3.1-kcl.1